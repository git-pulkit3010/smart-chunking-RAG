[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-chunking-rag"
version = "0.1.0"
description = "CLI RAG application for research paper PDFs with layout-aware intelligent chunking and OpenRouter embeddings/generation"
readme = "README.md"
authors = [{ name = "AI Research Engineer" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pymupdf>=1.24.0",
    "openrouter>=1.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
paper-rag = "paper_rag:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "paper_rag*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
